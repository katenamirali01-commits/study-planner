<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планировщик учёбы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📚 Мой планировщик</h1>
      <p id="todayDate" class="subtitle"></p>
    </header>

    <div class="progress-box">
      <p id="progressText">Нет задач</p>
      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="form">
      <input type="text" id="taskInput" placeholder="Напиши здесь...">

      <label class="check">
        <input type="checkbox" id="timeToggle">
        ⏰ Указать время
      </label>

      <div id="timeFields" class="hidden">
        <input type="time" id="startInput">
        <span>—</span>
        <input type="time" id="endInput">
      </div>

      <button id="addButton">➕ Добавить</button>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyText" class="empty">Пока задач нет. Добавь первую! ✨</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
